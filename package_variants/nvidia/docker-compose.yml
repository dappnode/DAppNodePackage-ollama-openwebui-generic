version: "3.5"

services:
  webui:
    build:
      context: webui
    container_name: openwebui-nvidia.ollama-openwebui.dnp.dappnode.eth
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    build:
      context: ollama
    container_name: ollama-nvidia.ollama-openwebui.dnp.dappnode.eth
